name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore OpenCamInterop.sln --locked-mode

      - name: Test before packaging
        run: dotnet test OpenCamInterop.sln --configuration Release --no-restore --verbosity normal

      - name: Publish self-contained CLI
        run: >-
          dotnet publish tools/OpenCamInterop.Tool/OpenCamInterop.Tool.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --output artifacts/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Normalize launcher name
        shell: pwsh
        run: |
          $suffix = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          Move-Item -LiteralPath "artifacts/${{ matrix.rid }}/OpenCamInterop.Tool$suffix" -Destination "artifacts/${{ matrix.rid }}/opencaminterop$suffix"

      - name: Archive Windows CLI
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "artifacts/opencaminterop-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Archive Linux CLI
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C "artifacts/${{ matrix.rid }}" -czf "artifacts/opencaminterop-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: opencaminterop-${{ matrix.rid }}
          path: artifacts/opencaminterop-${{ github.ref_name }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Create prerelease
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: opencaminterop-*
          path: release
          merge-multiple: true

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --draft
          --prerelease
          --generate-notes
          --title "OpenCamInterop ${GITHUB_REF_NAME}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/*

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
